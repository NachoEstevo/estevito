<!doctype html>
<html
  lang="es"
  data-es-title="Devuelta al remitente · Ignacio Estevo"
  data-en-title="Return to sender · Ignacio Estevo"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Devuelta al remitente · Ignacio Estevo</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #fafaf9;
        --ink: #262725;
        --body: #565b53;
        --muted: #666d62;
        --line: #dfe2d8;
        --accent: #426346;
        --soft: #edf0e9;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        font-family: system-ui, sans-serif;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --paper: #171917;
        --ink: #edf0e9;
        --body: #b6bdb0;
        --muted: #a4ad9e;
        --line: #343a31;
        --accent: #a6c8a5;
        --soft: #232821;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --paper: #171917;
          --ink: #edf0e9;
          --body: #b6bdb0;
          --muted: #a4ad9e;
          --line: #343a31;
          --accent: #a6c8a5;
          --soft: #232821;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
      }
      a {
        color: inherit;
        text-underline-offset: 0.25em;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      a:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 5px;
      }
      [hidden] {
        display: none !important;
      }
      .shell {
        width: min(1136px, calc(100% - 88px));
        margin: auto;
      }
      header {
        height: 98px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        text-decoration: none;
        font-size: 13px;
        font-weight: 620;
      }
      .brand img {
        width: 32px;
        height: 32px;
        object-fit: cover;
        border-radius: 7px;
      }
      .language {
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 50%;
        width: 42px;
        height: 42px;
        font-size: 12px;
      }
      h1,
      p {
        margin: 0;
      }
      h1 {
        font-family: Georgia, serif;
        font-weight: 400;
        letter-spacing: -0.065em;
        font-size: clamp(3.3rem, 6vw, 6rem);
        line-height: 0.98;
      }
      .code {
        display: block;
        color: var(--accent);
        font:
          550 0.75rem/1.2 ui-monospace,
          monospace;
        letter-spacing: 0.1em;
        margin-bottom: 24px;
      }
      .message {
        color: var(--body);
        font-size: 15px;
        line-height: 1.65;
        max-width: 31ch;
        margin-top: 24px;
      }
      nav {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px 22px;
        margin-top: 29px;
        font-size: 13px;
      }
      .home {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        text-decoration: none;
        padding: 0 15px;
        background: var(--ink);
        color: var(--paper);
        border-radius: 6px;
      }
      .project-link {
        color: var(--body);
        display: inline-flex;
        align-items: center;
        min-height: 44px;
      }
      @media (max-width: 680px) {
        .shell {
          width: calc(100% - 40px);
        }
        header {
          height: 70px;
        }
        .code {
          margin-bottom: 13px;
        }
        .message {
          margin-top: 17px;
        }
        nav {
          margin-top: 17px;
          gap: 8px 17px;
        }
        h1 {
          font-size: clamp(2.75rem, 12vw, 4rem);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }

      @font-face {
        font-family: Caveat;
        src: url('/assets/fonts/caveat-latin.woff2') format('woff2');
        font-display: swap;
      }
      .postal {
        min-height: calc(100svh - 98px);
        display: grid;
        grid-template-columns: minmax(0, 0.78fr) minmax(0, 1.22fr);
        gap: 38px;
        align-items: center;
        padding: 75px 0 100px;
      }
      .postal h1 {
        max-width: 8ch;
      }
      .mail {
        margin: 0;
        min-width: 0;
      }
      .card {
        position: relative;
        isolation: isolate;
        aspect-ratio: 1.57;
        border: 1px solid #dfd5bf;
        border-radius: 3px;
        background: #f5efdf;
        color: #38362f;
        box-shadow:
          1px 3px 0 #e9e0cb,
          3px 6px 0 -1px #d6c9ae,
          12px 24px 40px -15px #29231748;
        transform: rotate(-2deg);
        overflow: hidden;
      }
      .card-face {
        position: absolute;
        inset: 0;
        padding: 5%;
      }
      .card-face.swap {
        animation: turn 0.44s var(--ease);
      }
      @keyframes turn {
        from {
          transform: perspective(900px) rotateY(-52deg);
          opacity: 0.48;
        }
        to {
          transform: perspective(900px) rotateY(0);
          opacity: 1;
        }
      }
      .card-back {
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
        align-items: end;
        gap: 4%;
      }
      .note {
        border-right: 1px solid #bcb097;
        padding: 0 11% 3% 0;
        margin-bottom: 3%;
        font:
          clamp(1.2rem, 2.65vw, 2.4rem) / 1.04 Caveat,
          cursive;
        color: #434338;
      }
      .note small {
        display: block;
        margin-top: 0.6em;
        font-size: 0.74em;
      }
      .address {
        min-width: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 0;
        padding-bottom: 1%;
      }
      .address span {
        height: clamp(20px, 3vw, 45px);
        display: flex;
        align-items: center;
        border-bottom: 1px solid #bcb097;
        font-size: clamp(0.51rem, 1.05vw, 0.8rem);
        font-family: ui-monospace, monospace;
        overflow-wrap: anywhere;
      }
      .address [data-route] {
        display: block;
        align-content: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .stamp {
        position: absolute;
        right: 5%;
        top: 6%;
        width: 18%;
        height: 32%;
        object-fit: contain;
        object-position: right top;
      }
      .cancellation {
        position: absolute;
        right: 17%;
        top: 8%;
        width: 14%;
        aspect-ratio: 1;
        border: 1px solid #66544570;
        border-radius: 50%;
        display: grid;
        place-content: center;
        text-align: center;
        transform: translate(13%, 9%) rotate(-12deg);
        mix-blend-mode: multiply;
        opacity: 0.82;
        font:
          550 clamp(0.42rem, 0.85vw, 0.69rem) / 1.3 ui-monospace,
          monospace;
        color: #665445;
      }
      .stampmark {
        position: absolute;
        top: 34%;
        left: 39%;
        transform: rotate(-9deg);
        border: 2px solid #9b372a;
        color: #933327;
        padding: 0.55em 0.7em;
        text-align: center;
        font:
          700 clamp(0.53rem, 1.1vw, 0.98rem) / 1.2 ui-monospace,
          monospace;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        outline: 1px dashed #9b372a;
        outline-offset: -5px;
        animation: stamp 0.58s 0.33s both var(--ease);
      }
      @keyframes stamp {
        from {
          opacity: 0;
          transform: translateY(-12px) rotate(-12deg) scale(1.13);
        }
        to {
          opacity: 1;
          transform: rotate(-9deg);
        }
      }
      .photo-face {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 6%;
        align-items: center;
      }
      .photo-face img {
        width: 100%;
        height: 100%;
        min-height: 0;
        object-fit: cover;
        object-position: center 15%;
        border-radius: 1px;
      }
      .place {
        font:
          400 clamp(1.6rem, 3.5vw, 3.4rem) / 0.97 Georgia,
          serif;
        letter-spacing: -0.045em;
      }
      .place span {
        display: block;
        margin-top: 12px;
        font:
          500 0.75rem/1.2 system-ui,
          sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .mail figcaption {
        display: flex;
        justify-content: flex-end;
        margin: 23px 0 0;
      }
      .flip {
        border: 0;
        background: none;
        text-decoration: underline;
        text-underline-offset: 0.3em;
        color: var(--body);
        padding: 9px 0;
        min-height: 44px;
        font-size: 13px;
      }
      @media (max-width: 850px) {
        .postal {
          grid-template-columns: 0.8fr 1.2fr;
          gap: 25px;
        }
      }
      @media (max-width: 680px) {
        .postal {
          display: flex;
          flex-direction: column;
          align-items: stretch;
          justify-content: center;
          gap: 37px;
          min-height: 0;
          padding: 42px 0 36px;
        }
        .postal h1 {
          max-width: 9ch;
        }
        .mail {
          width: 100%;
          max-width: 500px;
          align-self: center;
        }
        .mail figcaption {
          margin-top: 13px;
        }
        .note {
          font-size: clamp(1rem, 5vw, 1.65rem);
        }
        .stampmark {
          font-size: clamp(0.47rem, 2.15vw, 0.8rem);
        }
        .address span {
          font-size: clamp(0.45rem, 2vw, 0.67rem);
        }
        .cancellation {
          font-size: clamp(0.4rem, 1.5vw, 0.56rem);
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <a class="brand" href="/"
          ><img
            src="/assets/avatar.webp"
            alt=""
            width="32"
            height="32"
          />Ignacio Estevo</a
        ><button
          class="language"
          type="button"
          aria-label="Switch to English"
          hidden
        >
          EN
        </button>
      </header>
      <main>
        <article class="postal">
          <section aria-labelledby="title404">
            <span class="code">404</span>
            <h1 id="title404" data-en="Return to sender">
              Devuelta al remitente
            </h1>
            <p
              class="message"
              data-en="This postcard came back. The address you followed no longer exists."
            >
              Esta postal volvió. La dirección que buscabas ya no existe.
            </p>
            <nav
              aria-label="Volver al portfolio"
              data-label-en="Return to the portfolio"
            >
              <a href="/" class="home" data-en="Back to home"
                >Volver al inicio</a
              ><a
                href="/#work-heading"
                class="project-link"
                data-en="See projects"
                >Ver proyectos</a
              >
            </nav>
          </section>
          <figure class="mail">
            <div class="card" id="postal-card">
              <div id="postal-back" class="card-face card-back">
                <img
                  class="stamp"
                  src="/assets/postcard-europe.webp"
                  alt=""
                  width="88"
                  height="104"
                />
                <div class="cancellation" aria-hidden="true">
                  BELLAGIO<br />ITALIA
                </div>
                <div
                  class="stampmark"
                  aria-hidden="true"
                  data-en="404 · Address unknown"
                >
                  404 · Dirección desconocida
                </div>
                <p class="note">
                  <span
                    data-en="Greetings from Bellagio. I saved you a view of the town."
                    >Saludos desde Bellagio. Te guardé una vista del
                    pueblo.</span
                  ><small>— Nacho</small>
                </p>
                <div class="address">
                  <span data-en="TO">PARA</span
                  ><span data-route dir="ltr"></span><span></span>
                </div>
              </div>
              <div id="postal-photo" class="card-face photo-face" hidden>
                <img
                  src="/assets/photo-bellagio-thumb.webp"
                  width="440"
                  height="660"
                  alt="Torre de ladrillo entre los árboles en Bellagio"
                  data-alt-en="Brick tower among the trees in Bellagio"
                />
                <p class="place">Bellagio<span data-en="Italy">Italia</span></p>
              </div>
            </div>
            <figcaption>
              <button
                class="flip"
                type="button"
                aria-controls="postal-card"
                aria-pressed="false"
                data-en="Flip the postcard"
                hidden
              >
                Dar vuelta la postal
              </button>
            </figcaption>
          </figure>
        </article>
      </main>
    </div>
    <script>
      (() => {
        const root = document.documentElement;
        const language = document.querySelector('.language');
        const entries = [
          ...document.querySelectorAll(
            '[data-en], [data-alt-en], [data-label-en]',
          ),
        ].map((element) => {
          const attribute = element.hasAttribute('data-en')
            ? null
            : element.hasAttribute('data-alt-en')
              ? 'alt'
              : 'aria-label';
          const english =
            element.dataset.en ??
            element.dataset.altEn ??
            element.dataset.labelEn;
          return {
            element,
            attribute,
            english,
            spanish: attribute
              ? element.getAttribute(attribute)
              : element.textContent,
          };
        });
        function applyLanguage(english) {
          root.lang = english ? 'en' : 'es';
          document.title = english
            ? root.dataset.enTitle
            : root.dataset.esTitle;
          for (const entry of entries) {
            const value = english ? entry.english : entry.spanish;
            if (entry.attribute)
              entry.element.setAttribute(entry.attribute, value);
            else entry.element.textContent = value;
          }
          language.textContent = english ? 'ES' : 'EN';
          language.setAttribute(
            'aria-label',
            english ? 'Cambiar a español' : 'Switch to English',
          );
        }
        let english = false;
        try {
          english = localStorage.getItem('nacho-cv-language') === 'en';
          const theme = localStorage.getItem('nacho-cv-theme');
          if (theme === 'dark' || theme === 'light') root.dataset.theme = theme;
        } catch {}
        applyLanguage(english);
        language.hidden = false;
        language.addEventListener('click', () => {
          english = !english;
          applyLanguage(english);
          try {
            localStorage.setItem('nacho-cv-language', root.lang);
          } catch {}
        });
        const route = document.querySelector('[data-route]');
        let pathname = location.pathname;
        try {
          pathname = decodeURI(pathname);
        } catch {}
        route.textContent = pathname;
        route.title = pathname;

        const flip = document.querySelector('.flip');
        const back = document.querySelector('#postal-back');
        const photo = document.querySelector('#postal-photo');
        flip.hidden = false;
        flip.addEventListener('click', () => {
          const showPhoto = photo.hidden;
          photo.hidden = !showPhoto;
          back.hidden = showPhoto;
          flip.setAttribute('aria-pressed', String(showPhoto));
          back.classList.toggle('swap', !showPhoto);
          photo.classList.toggle('swap', showPhoto);
        });
      })();
    </script>
  </body>
</html>
